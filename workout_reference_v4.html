<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Workout Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --black:  #0a0a0a;
    --dark:   #111111;
    --card:   #181818;
    --card2:  #202020;
    --border: rgba(255,255,255,0.07);
    --border2:rgba(255,255,255,0.13);
    --white:  #f0ede6;
    --muted:  #7a7870;
    --dim:    #3a3a38;
    --chest:  #E85D24;
    --back:   #3B8BD4;
    --legs:   #52A84B;
    --rest:   #666660;
    --accent: #E8C84A;
    --rp-c:   #E8A84A;
    --fl-c:   #52A84B;
    --rir-c:  #9B72CF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
  body { display: flex; flex-direction: column; max-width: 430px; margin: 0 auto; min-height: 100vh; }

  /* ── Header ── */
  .header { padding: 52px 20px 14px; background: var(--black); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
  .header-top { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
  .header-title { font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 1px; line-height: 1; color: var(--white); }
  .header-title span { color: var(--accent); }
  .version-pill { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid rgba(232,200,74,0.3); border-radius: 20px; padding: 3px 10px; margin-bottom: 6px; }

  /* ── Day strip ── */
  .day-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .day-btn { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 2px 6px; cursor: pointer; transition: all .18s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .day-btn.active { border-color: var(--accent); background: rgba(232,200,74,0.08); }
  .day-btn:active { transform: scale(.95); }
  .day-name { font-size: 10px; font-weight: 600; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
  .day-btn.active .day-name { color: var(--accent); }
  .day-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* ── Scroll area ── */
  .main { flex: 1; overflow-y: auto; padding: 0 0 110px; -webkit-overflow-scrolling: touch; }

  /* ── Day hero ── */
  .day-hero { padding: 22px 20px 14px; border-bottom: 1px solid var(--border); }
  .day-hero-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
  .day-type-label { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 1px; line-height: 1; }
  .day-badge { font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; flex-shrink: 0; }
  .day-sub { font-size: 12px; color: var(--muted); font-weight: 300; margin-bottom: 10px; }
  .day-meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .meta-pill { font-size: 11px; font-weight: 400; color: var(--muted); background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; }

  /* ── Legend ── */
  .legend-strip { display: flex; gap: 12px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--dark); }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); }
  .legend-dot { width: 6px; height: 6px; border-radius: 2px; flex-shrink: 0; }

  /* ── Sections ── */
  .section { padding: 14px 20px 0; }
  .section-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .section-tag { font-size: 9px; font-weight: 600; letter-spacing: .06em; padding: 1px 6px; border-radius: 3px; text-transform: uppercase; }
  .s-rp  { background: rgba(232,168,74,0.12); color: var(--rp-c); }
  .s-fl  { background: rgba(82,168,75,0.12);  color: var(--fl-c); }
  .s-act { background: rgba(102,102,96,0.12); color: var(--muted); }

  /* ── Exercise cards ── */
  .ex-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; margin-bottom: 7px; cursor: pointer; transition: border-color .15s, background .15s; }
  .ex-card:active { background: var(--card2); }
  .ex-card.expanded { border-color: var(--border2); }
  .ex-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .ex-name { font-size: 14px; font-weight: 500; color: var(--white); line-height: 1.3; }
  .ex-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .ex-sets { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: .5px; white-space: nowrap; }
  .ex-rest { font-size: 10px; font-weight: 500; color: var(--muted); text-align: right; }
  .ex-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; justify-content: flex-end; }
  .b { font-size: 8px; font-weight: 600; letter-spacing: .06em; padding: 1px 5px; border-radius: 3px; text-transform: uppercase; }
  .b-rp  { background: rgba(232,168,74,0.14); color: var(--rp-c); }
  .b-fl  { background: rgba(82,168,75,0.14);  color: var(--fl-c); }
  .b-rir { background: rgba(155,114,207,0.14); color: var(--rir-c); }
  .ex-note { font-size: 12px; color: var(--muted); font-weight: 300; line-height: 1.55; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: none; }
  .ex-note em { color: var(--accent); font-style: normal; font-weight: 500; }
  .ex-card.expanded .ex-note { display: block; }
  .ex-chevron { font-size: 10px; color: var(--dim); margin-top: 3px; transition: transform .2s; display: block; text-align: right; }
  .ex-card.expanded .ex-chevron { transform: rotate(180deg); }

  /* ── Tip ── */
  .tip-section { padding: 16px 20px 0; }
  .tip-box { background: var(--card); border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0; padding: 14px 16px; }
  .tip-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .tip-text { font-size: 13px; color: var(--muted); line-height: 1.65; font-weight: 300; }

  /* ── Nutrition ── */
  .nutr-section { padding: 14px 20px 0; }
  .nutr-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  .nutr-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .nutr-pill { font-size: 12px; padding: 5px 12px; border-radius: 20px; background: var(--card); border: 1px solid var(--border); color: var(--muted); }

  /* ── Colors ── */
  .chest-color { color: var(--chest); } .back-color { color: var(--back); }
  .legs-color  { color: var(--legs);  } .rest-color { color: var(--rest); }
  .badge-chest { background: rgba(232,93,36,0.15);   color: var(--chest); }
  .badge-back  { background: rgba(59,139,212,0.15);  color: var(--back);  }
  .badge-legs  { background: rgba(82,168,75,0.15);   color: var(--legs);  }
  .badge-rest  { background: rgba(102,102,96,0.15);  color: var(--rest);  }
  .dot-chest { background: var(--chest); } .dot-back  { background: var(--back);  }
  .dot-legs  { background: var(--legs);  } .dot-rest  { background: var(--rest);  }

  /* ── Bottom hint ── */
  .bottom-hint { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: linear-gradient(to top, var(--black) 60%, transparent); padding: 20px 20px 14px; pointer-events: none; text-align: center; }
  .bottom-hint span { font-size: 11px; color: var(--dim); }

  /* ── Animations ── */
  .day-hero, .legend-strip, .section, .tip-section, .nutr-section { animation: fadeUp .22s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-title">MY <span>PLAN</span></div>
    <div class="version-pill">v4</div>
  </div>
  <div class="day-strip" id="day-strip"></div>
</div>

<div class="main" id="main"></div>
<div class="bottom-hint"><span>Tap any exercise to expand notes</span></div>

<script>
const RP  = '<span class="b b-rp">Rev. Pyramid</span>';
const FL  = '<span class="b b-fl">Flat Sets</span>';
const RIR = '<span class="b b-rir">1–2 RIR</span>';

const days = [

  // ── MONDAY — CHEST I ────────────────────────────────────────────────────────
  {
    label:'Mon', tag:'Chest I', tagClass:'chest',
    typeLabel:'CHEST I — UPPER',
    sub:'Incline primary · Planet Fitness or college gym',
    meta:['Cap 80 min', 'Upper chest emphasis', 'Abs as finisher'],
    sections:[
      { head:'Warm-up', tag:null, exercises:[
        { name:'Light cardio or arm circles', sets:'5 min', rest:'', badges:[], note:'Prime the shoulder joint before pressing. No equipment needed.' }
      ]},
      { head:'Primary compound', tag:'rp', exercises:[
        { name:'Incline barbell or dumbbell press', sets:'4 × 8–10', rest:'Rest 90–120s', badges:[RP,RIR], note:'<em>Heaviest set first.</em> This is your primary mover today — upper chest is the target. Incline barbell if available, incline dumbbell if not. Drop 5lb per side each set. Progress your top set 5lb every 1–2 weeks.' }
      ]},
      { head:'Secondary compound', tag:'rp', exercises:[
        { name:'Flat barbell bench press', sets:'3 × 8–10', rest:'Rest 90s', badges:[RP,RIR], note:'Reverse pyramid. Mid chest and overall mass. Slightly less volume here than Friday since incline is the priority today.' }
      ]},
      { head:'Isolation', tag:'fl', exercises:[
        { name:'Cable chest fly or pec deck', sets:'3 × 12', rest:'Rest 60s', badges:[FL], note:'Same weight all sets. Full stretch at the bottom, slow eccentric on the way back. Squeeze at peak contraction.' }
      ]},
      { head:'Triceps', tag:'fl', exercises:[
        { name:'Tricep rope pulldown', sets:'3 × 12', rest:'Rest 60s', badges:[FL], note:'Straight sets, tight rest. Feel the full lockout at the bottom of every rep.' },
        { name:'Tricep dips (bench or bars)', sets:'3 × 10–12', rest:'Rest 60s', badges:[FL], note:'Bodyweight. Controlled descent. Slight forward lean for additional chest involvement.' },
        { name:'Skull crushers', sets:'3 × 10', rest:'Rest 60s', badges:[FL], note:'<em>Triceps are pre-fatigued here</em> — keep weight conservative and focus on the stretch at the bottom. Long head emphasis.' }
      ]},
      { head:'Abs finisher — pick one, alternate weekly', tag:'act', exercises:[
        { name:'Incline crunches  or  Captain\'s chair leg raises', sets:'3 × 12–15', rest:'Rest 45s', badges:[FL], note:'<em>Alternate week to week</em> — incline crunches hit upper abs, captain\'s chair hits lower abs and hip flexors. Tight rest, done in under 8 minutes.' }
      ]}
    ],
    tip:'Incline is your primary today — protect that energy. Flat bench is secondary support work, not a competition. Skull crushers close the session so triceps are already warmed from dips and pulldowns — go lighter than you think and feel the stretch.',
    nutrition:['Eat 1hr before training','Shake within 30 min after','High protein lunch follows']
  },

  // ── TUESDAY — LEGS I ────────────────────────────────────────────────────────
  {
    label:'Tue', tag:'Legs I', tagClass:'legs',
    typeLabel:'LEGS I — QUADS',
    sub:'Quad focus · no glute/hamstring pre-fatigue',
    meta:['Cap 90 min', 'Plan your route first', 'Calves non-negotiable'],
    sections:[
      { head:'Warm-up', tag:null, exercises:[
        { name:'Bodyweight squats', sets:'2 × 15', rest:'', badges:[], note:'Open the hips before loading. No weight — movement prep only.' }
      ]},
      { head:'Primary compound', tag:'rp', exercises:[
        { name:'Barbell squat', sets:'4 × 8–10', rest:'Rest 2–3 min', badges:[RP,RIR], note:'<em>Heaviest first.</em> 45+25lb starting point, drop 10lb each set. Stop 1–2 reps before failure. Your overall strength anchor for the week.' }
      ]},
      { head:'Secondary compound', tag:'rp', exercises:[
        { name:'Incline leg press', sets:'4 × 10–12', rest:'Rest 90s', badges:[RP,RIR], note:'High foot placement for more quad. Load heavy on the first set, drop each set. Full range — don\'t cut depth. This is where you can push volume since squats opened the session.' }
      ]},
      { head:'Isolation', tag:'fl', exercises:[
        { name:'Leg extensions', sets:'3 × 12–15', rest:'Rest 60s', badges:[FL], note:'80–100lb all sets. Squeeze hard at the top — full quad contraction. 60s rest, consistent weight.' }
      ]},
      { head:'Calves — slow reps, full range', tag:'fl', exercises:[
        { name:'Seated calf raises', sets:'4 × 15–20', rest:'Rest 60s', badges:[FL], note:'2 seconds up, pause at top, 2 seconds down. <em>Speed is the enemy here.</em> Four sets, full range, no rushing. This is how calves grow.' }
      ]}
    ],
    tip:'No Bulgarian split squat today — that lives on Legs II. Keeping quads isolated here means you\'re not pre-fatiguing glutes or hamstrings before Saturday. Leg press after squats is pure volume on an already-loaded quad.',
    nutrition:['Biggest meal after this session','Jasmine rice + chicken ideal','Shake immediately post-workout']
  },

  // ── WEDNESDAY — REST ────────────────────────────────────────────────────────
  {
    label:'Wed', tag:'Rest', tagClass:'rest',
    typeLabel:'ACTIVE RECOVERY',
    sub:'Strategic rest — no lifting',
    meta:['No heavy lifting', 'Stretch before bed', '7–8 hrs sleep'],
    sections:[
      { head:'What to do', tag:null, exercises:[
        { name:'Light walking between classes', sets:'Natural', rest:'', badges:[], note:'You\'re already moving — don\'t force extra. Let the body absorb Monday and Tuesday.' },
        { name:'Hip flexor + chest opener stretch', sets:'10–15 min', rest:'', badges:[], note:'Before bed. Undoes the cumulative sitting. Hips and chest both need this after two heavy days.' },
        { name:'7–8 hrs sleep', sets:'Non-negotiable', rest:'', badges:[], note:'Muscle is built during sleep, not in the gym. Wednesday recovery is what makes Thursday and Friday sessions productive.' }
      ]},
      { head:'What not to do', tag:null, exercises:[
        { name:'No heavy lifting today', sets:'—', rest:'', badges:[], note:'Do not train through it. Even a light session costs you Thursday and Friday output.' }
      ]}
    ],
    tip:'Wednesday rest is strategy. You have four hard training days this week — Mon, Tue, Thu, Fri. This break is what keeps all four sessions high quality. Eat your protein today even though you\'re resting.',
    nutrition:['Hit protein even on rest days','Overnight oats — zero effort breakfast','Prep dinner early']
  },

  // ── THURSDAY — BACK, BICEPS & SHOULDERS ─────────────────────────────────────
  {
    label:'Thu', tag:'Back', tagClass:'back',
    typeLabel:'BACK, BICEPS & SHOULDERS',
    sub:'Strength first · feel second · isolation last',
    meta:['Cap 85 min', 'Elbows lead every pull', 'Obliques as finisher'],
    sections:[
      { head:'Warm-up', tag:null, exercises:[
        { name:'Light band pull-apart or light row', sets:'2 × 15', rest:'', badges:[], note:'Activates rear delts and rhomboids before loading. Back needs a longer warm-up than chest.' }
      ]},
      { head:'Primary back — barbell (strength)', tag:'rp', exercises:[
        { name:'Barbell bent-over row', sets:'4 × 8–10', rest:'Rest 90–120s', badges:[RP,RIR], note:'<em>Heaviest first.</em> 45° hip hinge, chest up, neutral spine. Bar drives to lower stomach. Elbows lead — hands are just hooks. Reverse pyramid, drop each set.' }
      ]},
      { head:'Overhead press — shoulders', tag:'rp', exercises:[
        { name:'Overhead barbell press (military press)', sets:'3 × 8–10', rest:'Rest 90s', badges:[RP,RIR], note:'Placed after rows while you\'re still strong. <em>Narrow grip, push your head through at the top, core braced</em> — if you feel this in your lats, grip is too wide or you\'re not fully extending. Reverse pyramid.' }
      ]},
      { head:'Back — cable (feel and width)', tag:'fl', exercises:[
        { name:'V-bar seated cable row', sets:'3 × 10–12', rest:'Rest 75s', badges:[FL,RIR], note:'Flat weight. After heavy barbell work this is about <em>quality of contraction</em> — elbows drive toward hips, squeeze shoulder blades together at the end of every rep.' },
        { name:'Wide grip lat pulldown', sets:'3 × 10–12', rest:'Rest 75s', badges:[FL,RIR], note:'Pull to collarbone, slight lean back. Lat width. Flat weight — you\'re chasing the stretch and squeeze here, not load. No narrow grip needed — V-bar already covers that angle.' }
      ]},
      { head:'Shoulders — isolation', tag:'fl', exercises:[
        { name:'Dumbbell lateral raises', sets:'3 × 15', rest:'Rest 45s', badges:[FL], note:'Light weight — 10–15lb. Slight bend in elbow, lead with the elbow not the hand. <em>Medial delt width</em> — this is what builds the shoulder cap. Consistent weight, no swinging.' }
      ]},
      { head:'Biceps', tag:'fl', exercises:[
        { name:'Barbell or EZ bar curl', sets:'3 × 10–12', rest:'Rest 60s', badges:[FL,RIR], note:'35–45lb. Controlled — no swinging. Let the bar descend slowly on every rep.' },
        { name:'Seated preacher curl', sets:'3 × 10', rest:'Rest 60s', badges:[FL], note:'30–40lb. Isolates the bicep peak. Slow eccentric on the way down. <em>Drop this if the session runs long</em> — biceps have already been hit through every back pull.' }
      ]},
      { head:'Obliques finisher — ~6 min', tag:'fl', exercises:[
        { name:'Dumbbell side bends', sets:'3 × 12–15 each', rest:'Rest 45s', badges:[FL], note:'10–15lb. Feel the stretch on the opposite side as you lower. Slow and controlled. <em>Alternative:</em> cable oblique crunch for constant tension through the full range.' }
      ]}
    ],
    tip:'Barbell rows open because that\'s your heaviest back movement — you need full energy there. OHP follows while you\'re still strong before the fatigue of cable work sets in. Lateral raises and preacher curl are the dedicated shoulder and arm builders — keep rest tight on both to stay within cap.',
    nutrition:['Pre-workout meal 1hr before','Protein shake post-workout','Turkey sandwich + Greek yogurt for lunch']
  },

  // ── FRIDAY — CHEST II ───────────────────────────────────────────────────────
  {
    label:'Fri', tag:'Chest II', tagClass:'chest',
    typeLabel:'CHEST II — FLAT',
    sub:'Flat bench primary · mid chest and mass',
    meta:['Cap 80 min', 'Flat bench emphasis', 'Abs as finisher'],
    sections:[
      { head:'Warm-up', tag:null, exercises:[
        { name:'Light cardio or arm circles', sets:'5 min', rest:'', badges:[], note:'Same warm-up as Monday — shoulder joint prep before pressing.' }
      ]},
      { head:'Primary compound', tag:'rp', exercises:[
        { name:'Flat barbell bench press', sets:'4 × 8–10', rest:'Rest 90–120s', badges:[RP,RIR], note:'<em>Heaviest set first.</em> This is your primary today — flat bench for overall chest mass and strength. Start at 35lb/side, drop 5lb per side each set. Push your top set heavier than Monday\'s flat work.' }
      ]},
      { head:'Secondary compound', tag:'rp', exercises:[
        { name:'Incline dumbbell press', sets:'3 × 10–12', rest:'Rest 90s', badges:[RP,RIR], note:'Upper chest support work. 25–30lb first set, drop slightly. Incline was primary Monday — this is secondary support today. Still important, just less volume.' }
      ]},
      { head:'Isolation', tag:'fl', exercises:[
        { name:'Cable chest fly or pec deck', sets:'3 × 12', rest:'Rest 60s', badges:[FL], note:'Same weight all sets. Full stretch, slow eccentric. Consistent weight — you\'re finishing the chest here, not loading it.' }
      ]},
      { head:'Triceps', tag:'fl', exercises:[
        { name:'Tricep rope pulldown', sets:'3 × 12', rest:'Rest 60s', badges:[FL], note:'Straight sets, tight rest. Full lockout at the bottom every rep.' },
        { name:'Tricep dips (bench or bars)', sets:'3 × 10–12', rest:'Rest 60s', badges:[FL], note:'Bodyweight. Controlled descent — shoulders back, chest slightly forward.' },
        { name:'Skull crushers', sets:'3 × 10', rest:'Rest 60s', badges:[FL], note:'End of session — <em>keep weight conservative</em>, focus on the long head stretch. Triceps are well warmed at this point.' }
      ]},
      { head:'Abs finisher — pick one, alternate weekly', tag:'act', exercises:[
        { name:'Incline crunches  or  Captain\'s chair leg raises', sets:'3 × 12–15', rest:'Rest 45s', badges:[FL], note:'<em>Alternate with Monday\'s choice</em> — if you did incline crunches Monday, do captain\'s chair today. Covers both upper and lower abs across the week.' }
      ]}
    ],
    tip:'Flat bench is the primary here so you\'re pushing heavier than Monday\'s flat work. Four days between Monday chest and today gives you enough recovery to go hard. Skull crushers close both chest days — triceps are always pre-fatigued by then, so the weight will feel heavier than it looks.',
    nutrition:['Pre-workout meal 1hr before','Shake within 30 min after','High protein dinner']
  },

  // ── SATURDAY — LEGS II ──────────────────────────────────────────────────────
  {
    label:'Sat', tag:'Legs II', tagClass:'legs',
    typeLabel:'LEGS II — GLUTES & HAMS',
    sub:'Posterior chain focus · RDL opens heavy',
    meta:['Cap 90 min', 'RDL while freshest', 'Hip thrusts + split squats paired'],
    sections:[
      { head:'Warm-up', tag:null, exercises:[
        { name:'Hip circles + glute bridges', sets:'2 × 15', rest:'', badges:[], note:'Wake up the glutes before loading. These two movements take 3 minutes and make the whole session more effective.' }
      ]},
      { head:'Back extensions — activation only', tag:'act', exercises:[
        { name:'Back extensions (hyperextension bench)', sets:'2 × 15', rest:'', badges:[], note:'<em>Bodyweight only.</em> Erector spinae activation before heavy RDL. Not a strength set — two sets, slow and controlled.' }
      ]},
      { head:'Primary compound — hinge', tag:'rp', exercises:[
        { name:'Romanian deadlift (RDL)', sets:'4 × 8–10', rest:'Rest 90–120s', badges:[RP,RIR], note:'<em>Opens heavy while you\'re freshest.</em> Hip hinge, chest up, neutral spine — load descends along your legs, feel the hamstring stretch at the bottom. Reverse pyramid. This is your primary strength movement today.' }
      ]},
      { head:'Glute compound block', tag:'rp', exercises:[
        { name:'Hip thrust — Smith machine', sets:'4 × 10–12', rest:'Rest 90s', badges:[RP,RIR], note:'45+15lb starting point, drop each set. Drive through heels, <em>squeeze hard at the top</em> — hold for a beat at peak contraction. Hip thrusts support and reinforce your RDL strength.' },
        { name:'Bulgarian split squat', sets:'3 × 10 each', rest:'Rest 75s', badges:[FL,RIR], note:'Smith machine fine. Unilateral glute and quad compound — keeps both legs balanced. Same weight both sides. <em>Paired here with hip thrusts</em> because both are glute-dominant compound movements.' }
      ]},
      { head:'Isolation', tag:'fl', exercises:[
        { name:'Seated hamstring curl', sets:'3 × 12–15', rest:'Rest 60s', badges:[FL], note:'<em>3 seconds on the way down</em>, every rep. Slow eccentric is where hamstrings grow. Consistent weight — don\'t sacrifice tempo for load.' }
      ]},
      { head:'Calves — second session this week', tag:'fl', exercises:[
        { name:'Seated calf raises', sets:'3 × 20', rest:'Rest 45s', badges:[FL], note:'Two calf sessions per week is what actually produces growth. Same slow tempo — 2s up, pause, 2s down. Full range of motion.' }
      ]}
    ],
    tip:'RDL opens the session because it\'s your heaviest hinge movement and you need full energy for it. Hip thrusts and split squats are paired as your glute compound block — both drive glute power from different angles. Hamstring curls finish the isolation after all the compound work is done.',
    nutrition:['Biggest meal of the week after this','Max carbs + protein today','Highest calorie day of the week']
  },

  // ── SUNDAY — REST ───────────────────────────────────────────────────────────
  {
    label:'Sun', tag:'Rest', tagClass:'rest',
    typeLabel:'REST & MEAL PREP',

    sections:[
      { head:'Recovery', tag:null, exercises:[

        { name:'Light walk if desired', sets:'20–30 min', rest:'', badges:[], note:'Gentle movement only — not exercise. Keep the heart rate easy.' },

// ─── RENDER ───────────────────────────────────────────────────────────────────
let activeDay = 0;

function sectionTagHtml(tag) {
  if (!tag) return '';
  if (tag === 'rp')  return '<span class="section-tag s-rp">Reverse Pyramid</span>';
  if (tag === 'fl')  return '<span class="section-tag s-fl">Flat Sets</span>';
  if (tag === 'act') return '<span class="section-tag s-act">Activation</span>';
  return '';
}

function renderStrip() {
  document.getElementById('day-strip').innerHTML = days.map((d, i) => `
    <button class="day-btn ${i===activeDay?'active':''}" onclick="selectDay(${i})">
      <span class="day-name">${d.label}</span>
      <span class="day-dot dot-${d.tagClass}"></span>
    </button>`).join('');
}

function renderMain() {
  const d = days[activeDay];
  let cardIdx = 0;

  let html = `
    <div class="day-hero">
      <div class="day-hero-top">
        <div class="day-type-label ${d.tagClass}-color">${d.typeLabel}</div>
        <span class="day-badge badge-${d.tagClass}">${d.tag}</span>
      </div>
      <div class="day-sub">${d.sub}</div>
      <div class="day-meta">${d.meta.map(m=>`<span class="meta-pill">${m}</span>`).join('')}</div>
    </div>
    <div class="legend-strip">
      <div class="legend-item"><div class="legend-dot" style="background:var(--rp-c)"></div>Reverse pyramid — heaviest set first</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--fl-c)"></div>Flat sets — consistent weight</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--rir-c)"></div>Leave 1–2 reps in reserve</div>
    </div>`;

  d.sections.forEach(s => {
    html += `<div class="section"><div class="section-label">${s.head} ${sectionTagHtml(s.tag)}</div>`;
    s.exercises.forEach(e => {
      const idx = cardIdx++;
      const hasNote = !!e.note;
      html += `
        <div class="ex-card" id="card-${idx}" onclick="${hasNote?`toggleCard(${idx})`:''}" style="${hasNote?'':'cursor:default'}">
          <div class="ex-top">
            <div class="ex-name">${e.name}</div>
            <div class="ex-right">
              <div class="ex-sets ${d.tagClass}-color">${e.sets}</div>
              ${e.rest ? `<div class="ex-rest">${e.rest}</div>` : ''}
              ${e.badges.length ? `<div class="ex-badges">${e.badges.join('')}</div>` : ''}
            </div>
          </div>
          ${hasNote ? `<div class="ex-note">${e.note}</div><span class="ex-chevron">▼</span>` : ''}
        </div>`;
    });
    html += `</div>`;
  });

  html += `
    <div class="tip-section">
      <div class="tip-box">
        <div class="tip-label">Coach note</div>
        <div class="tip-text">${d.tip}</div>
      </div>
    </div>
    <div class="nutr-section">
      <div class="nutr-label">Nutrition focus</div>
      <div class="nutr-pills">${d.nutrition.map(n=>`<span class="nutr-pill">${n}</span>`).join('')}</div>
    </div>`;

  document.getElementById('main').innerHTML = html;
  document.getElementById('main').scrollTop = 0;
}

function toggleCard(idx) {
  const card = document.getElementById(`card-${idx}`);
  if (card) card.classList.toggle('expanded');
}

function selectDay(i) {
  activeDay = i;
  renderStrip();
  renderMain();
}

// Auto-open to today's day
const jsDay = new Date().getDay();
const dayMap = {1:0, 2:1, 3:2, 4:3, 5:4, 6:5, 0:6};
activeDay = dayMap[jsDay] ?? 0;
renderStrip();
renderMain();
</script>
